{{- /* Floating "chat with my AI to book a meeting" widget. Vanilla JS, no deps.
       Streams from the Cloudflare Worker (/api/chat), which proxies the xpander gateway SSE.
       The Worker holds the API key; the browser never sees it. */ -}}
<style>
  #dm-btn { position: fixed; right: 20px; bottom: 20px; z-index: 60; display: inline-flex; align-items: center; justify-content: center;
    width: 52px; height: 52px; padding: 0; border-radius: 999px; border: 0; cursor: pointer; font-size: 1.3rem; line-height: 1;
    color: #fff; background: #216e39; box-shadow: 0 6px 24px rgba(0,0,0,0.18); transition: transform .15s ease, background .15s ease; }
  #dm-btn:hover { background: #1b5a2f; transform: translateY(-1px); }
  #dm-panel { position: fixed; right: 20px; bottom: 84px; z-index: 60; width: min(360px, calc(100vw - 40px)); height: 460px;
    display: none; flex-direction: column; border-radius: 14px; overflow: hidden; background: var(--theme, #fff);
    border: 1px solid var(--border, #e5e5e5); box-shadow: 0 16px 48px rgba(0,0,0,0.24); }
  #dm-panel.open { display: flex; }
  #dm-head { padding: 12px 14px; font-weight: 600; border-bottom: 1px solid var(--border, #eee); display: flex; justify-content: space-between; align-items: center; }
  #dm-head small { font-weight: 400; color: var(--secondary, #888); display: block; font-size: 0.72rem; }
  #dm-head button { background: none; border: 0; font-size: 1.1rem; cursor: pointer; color: var(--secondary, #888); }
  #dm-msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 0.9rem; line-height: 1.45; }
  #dm-msgs .m { max-width: 85%; padding: 8px 11px; border-radius: 12px; white-space: pre-wrap; }
  #dm-msgs .bot { align-self: flex-start; background: var(--code-bg, #f2f2f2); }
  #dm-msgs .me { align-self: flex-end; background: #216e39; color: #fff; }
  #dm-msgs .bot.typing::after { content: '▍'; opacity: 0.5; }
  #dm-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border, #eee); }
  #dm-input { flex: 1; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--border, #ddd); font: inherit; background: transparent; color: inherit; }
  #dm-form button { padding: 0 14px; border-radius: 10px; border: 0; background: #216e39; color: #fff; cursor: pointer; font-weight: 600; }
</style>

<button id="dm-btn" aria-label="Chat with Dudu's AI to book a meeting" title="Chat with my AI">💬</button>
<div id="dm-panel" role="dialog" aria-label="Book a meeting">
  <div id="dm-head"><span>Dudu's AI<small>Ask about my work or book a meeting</small></span><button id="dm-close" aria-label="Close">×</button></div>
  <div id="dm-msgs"></div>
  <form id="dm-form"><input id="dm-input" autocomplete="off" placeholder="Ask me anything, or say 'book a meeting'…" /><button type="submit">Send</button></form>
</div>

<script>
(function () {
  var local = ['localhost', '127.0.0.1'].indexOf(location.hostname) !== -1;
  // The domain's DNS lives on Route53 (GitHub Pages), not Cloudflare, so there's no
  // /api/* route on the origin - production calls the Worker's workers.dev URL directly.
  var AGENT_ENDPOINT = local ? 'http://localhost:8787/chat' : 'https://dudutwizer-chat.dudutwizer.workers.dev/chat';
  var btn = document.getElementById('dm-btn'), panel = document.getElementById('dm-panel'),
      msgs = document.getElementById('dm-msgs'), form = document.getElementById('dm-form'), input = document.getElementById('dm-input');
  var greeted = false, busy = false;
  // One stable conversation id for this browser session -> the agent keeps context across turns.
  var conversationId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'c-' + Date.now() + '-' + Math.floor(Math.random() * 1e9);

  function add(text, who) { var d = document.createElement('div'); d.className = 'm ' + who; d.textContent = text; msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; return d; }
  function open() { panel.classList.add('open'); input.focus(); if (!greeted) { greeted = true; add("Hey, I'm Dudu's AI. Ask me about his work, or tell me you'd like to meet and I'll help you book a time.", 'bot'); } }
  btn.addEventListener('click', function () { panel.classList.contains('open') ? panel.classList.remove('open') : open(); });
  document.getElementById('dm-close').addEventListener('click', function () { panel.classList.remove('open'); });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (busy) return;
    var text = input.value.trim(); if (!text) return;
    add(text, 'me'); input.value = ''; busy = true;
    var bot = add('', 'bot'); bot.classList.add('typing');
    var acc = '';
    try {
      var res = await fetch(AGENT_ENDPOINT, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, conversationId: conversationId || undefined }),
      });
      if (!res.ok || !res.body) throw new Error('http ' + res.status);
      var reader = res.body.getReader(), dec = new TextDecoder(), buf = '';
      function handle(record) {
        // SSE record -> the "data:" line(s). Tolerates \n or \r\n line endings.
        var dl = record.split(/\r?\n/).filter(function (l) { return l.indexOf('data:') === 0; }).map(function (l) { return l.slice(5).trim(); }).join('');
        if (!dl) return;
        var ev; try { ev = JSON.parse(dl); } catch (_) { return; }
        if (ev.type === 'chunk' && typeof ev.data === 'string') { acc += ev.data; bot.textContent = acc; msgs.scrollTop = msgs.scrollHeight; }
        else if (ev.type === 'task_finished' && ev.data && ev.data.result) { acc = ev.data.result; bot.textContent = acc; }
      }
      while (true) {
        var r = await reader.read();
        if (r.value) buf += dec.decode(r.value, { stream: true });
        var frames = buf.split(/\r?\n\r?\n/); buf = frames.pop();
        for (var i = 0; i < frames.length; i++) handle(frames[i]);
        if (r.done) { if (buf.trim()) handle(buf); break; }
      }
      if (!acc) bot.textContent = "…";
    } catch (_) {
      bot.textContent = "Sorry, I couldn't reach my brain just now. Try again in a moment.";
    } finally { bot.classList.remove('typing'); busy = false; input.focus(); }
  });
})();
</script>
