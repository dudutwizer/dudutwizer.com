{{- /* Simple, robust link card - no build-time remote fetch (microlink/getJSON removed). */ -}}
{{- $src := .Get "src" -}}
<div style="border:1px dotted;border-radius:5px;padding:10px;line-height:1.3em;margin:0.5em 0;">
  <a style="text-decoration:none;font-size:0.9em;font-weight:bold;word-break:break-all;" href="{{ $src }}">{{ with .Get "title" }}{{ . }}{{ else }}{{ $src }}{{ end }}</a>
</div>
